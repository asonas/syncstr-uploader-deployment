services:
  syncstr-uploader:
    build:
      context: "https://github.com/asonas/syncstr.git#${SYNCSTR_SOURCE_REF:-57b3d8cdfa498404795b9f7c96fe9f21c4196102}:server"
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    ports:
      - "127.0.0.1:4545:4545"
    environment:
      SYNCSTR_TOKEN_FILE: /storage/secrets/upload-token
      SYNCSTR_MUSIC_DIR: /storage/music
      SYNCSTR_STAGING_DIR: /storage/staging
      SYNCSTR_MAX_UPLOAD_BYTES: "100000000"
    volumes:
      - type: bind
        source: /mnt/data/syncstr
        target: /storage
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/data/syncstr/secrets
        target: /storage/secrets
        read_only: true
        bind:
          create_host_path: false
